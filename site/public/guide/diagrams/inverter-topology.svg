<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">AC coupling and DC coupling — where PV enters the system</title><desc id="desc">DC-coupled PV reaches charge control and a DC battery bus before the inverter. AC-coupled PV reaches a PV inverter and AC bus, with a separate bidirectional battery inverter. Outage operation needs compatible control and isolation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">AC coupling and DC coupling — where PV enters the system</text><text x="38" y="100" font-size="18" fill="#213e3d" text-anchor="start">DC COUPLED</text><rect x="45" y="128" width="100" height="65" rx="3" fill="#183e56" stroke="#7095a7"/><path d="M70.0,128 L70.0,193" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M95.0,128 L95.0,193" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M120.0,128 L120.0,193" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M45,149.66666666666666 L145,149.66666666666666" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M45,171.33333333333334 L145,171.33333333333334" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M145,162 L220,162" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="123" width="195" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="327.5" y="155" font-size="18" fill="#213e3d" text-anchor="middle">MPPT / DC bus</text><text x="327.5" y="181" font-size="14" fill="#213e3d" text-anchor="middle">PV and battery DC</text><path d="M425,162 L495,162" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="505" y="123" width="200" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="605.0" y="155" font-size="18" fill="#213e3d" text-anchor="middle">Battery inverter</text><text x="605.0" y="181" font-size="14" fill="#213e3d" text-anchor="middle">DC ↔ AC</text><path d="M705,162 L783,162" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="793" y="123" width="125" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="855.5" y="155" font-size="18" fill="#213e3d" text-anchor="middle">AC loads</text><path d="M328,203 L328,232" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="243" width="195" height="70" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="327.5" y="275" font-size="18" fill="#213e3d" text-anchor="middle">Battery + BMS</text><text x="38" y="355" font-size="18" fill="#213e3d" text-anchor="start">AC COUPLED</text><rect x="45" y="378" width="100" height="65" rx="3" fill="#183e56" stroke="#7095a7"/><path d="M70.0,378 L70.0,443" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M95.0,378 L95.0,443" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M120.0,378 L120.0,443" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M45,399.6666666666667 L145,399.6666666666667" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M45,421.3333333333333 L145,421.3333333333333" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M145,410 L220,410" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="230" y="372" width="195" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="327.5" y="404" font-size="18" fill="#213e3d" text-anchor="middle">PV inverter</text><text x="327.5" y="430" font-size="14" fill="#213e3d" text-anchor="middle">DC → AC</text><path d="M425,410 L495,410" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="505" y="372" width="200" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="605.0" y="404" font-size="18" fill="#213e3d" text-anchor="middle">AC bus / loads</text><text x="605.0" y="430" font-size="14" fill="#213e3d" text-anchor="middle">Controlled energy balance</text><path d="M705,410 L766,410" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="778" y="372" width="155" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="855.5" y="404" font-size="18" fill="#213e3d" text-anchor="middle">Battery system</text><text x="855.5" y="430" font-size="14" fill="#213e3d" text-anchor="middle">AC ↔ DC</text><text x="38" y="480" font-size="14" fill="#213e3d" text-anchor="start">Backup requires an approved grid-forming / isolation arrangement; AC bus ≠ grid by default.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>