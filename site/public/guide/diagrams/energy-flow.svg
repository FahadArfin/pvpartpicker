<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Follow the energy — watts now, watt-hours over time</title><desc id="desc">Sunlight reaches a PV array. DC power passes through charge control to a battery, then through an inverter to AC loads. Each conversion has losses.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Follow the energy — watts now, watt-hours over time</text><text x="40" y="112" font-size="16" fill="#213e3d" text-anchor="start">SUNLIGHT</text><path d="M106,128 L106,182" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="193" width="100" height="65" rx="3" fill="#183e56" stroke="#7095a7"/><path d="M80.0,193 L80.0,258" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M105.0,193 L105.0,258" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M130.0,193 L130.0,258" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M55,214.66666666666666 L155,214.66666666666666" fill="none" stroke="#83adbb" stroke-width="3"/><path d="M55,236.33333333333334 L155,236.33333333333334" fill="none" stroke="#83adbb" stroke-width="3"/><text x="40" y="288" font-size="18" fill="#213e3d" text-anchor="start">PV array: DC source</text><path d="M160,228 L249,228" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="189" width="190" height="82" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="355.0" y="221" font-size="18" fill="#213e3d" text-anchor="middle">MPPT / controller</text><text x="355.0" y="247" font-size="14" fill="#213e3d" text-anchor="middle">Tracks PV; regulates charging</text><path d="M450,228 L534,228" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="189" width="170" height="82" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="630.0" y="221" font-size="18" fill="#213e3d" text-anchor="middle">Battery + BMS</text><text x="630.0" y="247" font-size="14" fill="#213e3d" text-anchor="middle">Stores chemical energy</text><path d="M630,271 L630,330" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="545" y="341" width="170" height="82" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="630.0" y="373" font-size="18" fill="#213e3d" text-anchor="middle">Inverter</text><text x="630.0" y="399" font-size="14" fill="#213e3d" text-anchor="middle">DC → AC</text><path d="M715,382 L778,382" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="790" y="341" width="135" height="82" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="857.5" y="373" font-size="18" fill="#213e3d" text-anchor="middle">AC loads</text><text x="857.5" y="399" font-size="14" fill="#213e3d" text-anchor="middle">Power used now</text><text x="260" y="340" font-size="19" fill="#213e3d" text-anchor="start">Power (W) = instantaneous flow</text><text x="260" y="373" font-size="19" fill="#213e3d" text-anchor="start">Energy (Wh) = accumulated power × time</text><text x="260" y="439" font-size="15" fill="#213e3d" text-anchor="start">Transfer equipment and protection omitted for clarity.</text><rect x="790" y="442" width="135" height="50" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="857.5" y="474" font-size="18" fill="#213e3d" text-anchor="middle">Grid (optional)</text><path d="M858,423 L858,440" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>