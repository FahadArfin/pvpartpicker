<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Roof mounting — follow loads into the structure</title><desc id="desc">Conceptual cross-section shows a module clamped to a rail, rail attached through a weatherproof roof attachment to a rafter. Wind uplift and gravity travel through every connection. Roof covering alone is not the structural path.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Roof mounting — follow loads into the structure</text><path d="M100 300 L805 300 L805 350 L100 350z" fill="#e5d5b8" stroke="#947d59"/><text x="565" y="336" font-size="18" fill="#213e3d" text-anchor="start">Roof deck / covering</text><rect x="355" y="350" width="115" height="115" fill="#cdb58d" stroke="#947d59"/><text x="485" y="425" font-size="18" fill="#213e3d" text-anchor="start">Rafter / structural member</text><rect x="160" y="159" width="560" height="24" fill="#183e56"/><rect x="330" y="198" width="240" height="28" fill="#a4b7b5"/><text x="615" y="177" font-size="18" fill="#213e3d" text-anchor="start">Module</text><text x="590" y="219" font-size="18" fill="#213e3d" text-anchor="start">Rail</text><path d="M390 180 L390 225 M440 225 L440 379" stroke="#596d6d" stroke-width="12"/><text x="105" y="216" font-size="18" fill="#213e3d" text-anchor="start">Clamp</text><path d="M190,216 L374,194" fill="none" stroke="#376f66" stroke-width="3"/><path d="M350 301 L470 301 L470 282 L410 282" fill="none" stroke="#bf863c" stroke-width="6"/><text x="70" y="275" font-size="18" fill="#213e3d" text-anchor="start">Flashing / seal detail</text><path d="M260,273 L365,293" fill="none" stroke="#376f66" stroke-width="3"/><path d="M440,80 L440,137" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><text x="470" y="98" font-size="17" fill="#213e3d" text-anchor="start">Gravity</text><path d="M290,144 L290,84" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="103" font-size="17" fill="#213e3d" text-anchor="start">Wind uplift</text><text x="70" y="480" font-size="14" fill="#213e3d" text-anchor="start">Conceptual cross-section. Attachment spacing and seal method require the specific engineered system.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>