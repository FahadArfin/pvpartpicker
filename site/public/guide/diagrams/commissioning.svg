<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Commissioning — evidence before normal operation</title><desc id="desc">A conceptual sequence starts with approved documents and physical verification, then manufacturer configuration, controlled function tests, measurement baseline and owner handover. Failed checks return to diagnosis rather than progress.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Commissioning — evidence before normal operation</text><rect x="40" y="110" width="260" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="170.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">1 · Documents</text><text x="170.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Exact models / approved drawings</text><rect x="350" y="110" width="260" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="480.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">2 · Verification</text><text x="480.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Qualified inspection / safe tests</text><rect x="660" y="110" width="260" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="790.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">3 · Configuration</text><text x="790.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Manufacturer sequence / settings</text><rect x="660" y="315" width="260" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="790.0" y="347" font-size="18" fill="#213e3d" text-anchor="middle">4 · Function tests</text><text x="790.0" y="373" font-size="14" fill="#213e3d" text-anchor="middle">Modes / alarms / backup behavior</text><rect x="350" y="315" width="260" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="480.0" y="347" font-size="18" fill="#213e3d" text-anchor="middle">5 · Baseline</text><text x="480.0" y="373" font-size="14" fill="#213e3d" text-anchor="middle">Record measurements and firmware</text><rect x="40" y="315" width="260" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="170.0" y="347" font-size="18" fill="#213e3d" text-anchor="middle">6 · Handover</text><text x="170.0" y="373" font-size="14" fill="#213e3d" text-anchor="middle">Limits / shutdown / service plan</text><path d="M300,150 L338,150" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><path d="M610,150 L648,150" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><path d="M790,190 L790,303" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><path d="M660,355 L622,355" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><path d="M350,355 L312,355" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="455" font-size="17" fill="#213e3d" text-anchor="start">If a test fails: stop, record, diagnose and repeat the affected acceptance checks.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>