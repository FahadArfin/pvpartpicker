<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Ground rows — a geometry check, not a yearly shade model</title><desc id="desc">A raised row casts a longer shadow at lower solar elevation. Horizontal shadow reach is height divided by tangent of solar elevation. Terrain, azimuth and sloping ground complicate the geometry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Ground rows — a geometry check, not a yearly shade model</text><path d="M70,435 L900,435" fill="none" stroke="#376f66" stroke-width="3"/><path d="M185 435 L350 242" stroke="#214c62" stroke-width="14"/><path d="M610 435 L775 242" stroke="#214c62" stroke-width="14"/><path d="M350,242 L690,435" fill="none" stroke="#bd8030" stroke-width="3" stroke-dasharray="7 6"/><path d="M350,242 L350,435" fill="none" stroke="#809691" stroke-width="3" stroke-dasharray="7 6"/><path d="M350,458 L690,458" fill="none" stroke="#376f66" stroke-width="3"/><text x="365" y="335" font-size="22" fill="#213e3d" text-anchor="start">H</text><text x="435" y="487" font-size="20" fill="#213e3d" text-anchor="start">L = H ÷ tan(α)</text><text x="559" y="417" font-size="23" fill="#213e3d" text-anchor="start">α</text><text x="95" y="118" font-size="22" fill="#213e3d" text-anchor="start">Lower winter sun → longer shadow</text><text x="95" y="160" font-size="18" fill="#213e3d" text-anchor="start">Example: H = 2 m, α = 20°</text><text x="95" y="190" font-size="16" fill="#213e3d" text-anchor="start">L ≈ 5.49 m from the vertical projection of the upper edge</text><text x="710" y="310" font-size="18" fill="#213e3d" text-anchor="start">Next row</text><text x="710" y="350" font-size="15" fill="#213e3d" text-anchor="start">Row pitch also includes</text><text x="710" y="375" font-size="15" fill="#213e3d" text-anchor="start">the module footprint.</text><text x="710" y="403" font-size="14" fill="#213e3d" text-anchor="start">Not to scale.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>