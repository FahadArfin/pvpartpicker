<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Power is height; energy is the area under the curve</title><desc id="desc">A constant 2 kilowatt load from hour zero to hour three forms a rectangle of area 6 kilowatt-hours. A separate 6 kilowatt one-hour peak also uses 6 kilowatt-hours but needs more instantaneous power.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Power is height; energy is the area under the curve</text><path d="M95,420 L95,100" fill="none" stroke="#376f66" stroke-width="3"/><path d="M95,420 L865,420" fill="none" stroke="#376f66" stroke-width="3"/><path d="M95 420 L95 330 L605 330 L605 420z" fill="#bcded1" stroke="#28766a" stroke-width="3"/><path d="M690 420 L690 150 L860 150 L860 420z" fill="#f0dcb8" stroke="#ac803d" stroke-width="3"/><text x="35" y="95" font-size="18" fill="#213e3d" text-anchor="start">kW</text><text x="110" y="310" font-size="21" fill="#213e3d" text-anchor="start">2 kW × 3 h = 6 kWh</text><text x="641" y="115" font-size="18" fill="#213e3d" text-anchor="start">6 kW × 1 h = 6 kWh</text><text x="95" y="447" font-size="15" fill="#213e3d" text-anchor="middle">0</text><text x="265" y="447" font-size="15" fill="#213e3d" text-anchor="middle">1</text><text x="435" y="447" font-size="15" fill="#213e3d" text-anchor="middle">2</text><text x="605" y="447" font-size="15" fill="#213e3d" text-anchor="middle">3</text><text x="690" y="447" font-size="15" fill="#213e3d" text-anchor="middle">3.5</text><text x="860" y="447" font-size="15" fill="#213e3d" text-anchor="middle">4.5</text><text x="778" y="481" font-size="18" fill="#213e3d" text-anchor="start">Time (hours)</text><text x="115" y="216" font-size="20" fill="#213e3d" text-anchor="start">Same energy; different power requirement.</text><text x="100" y="480" font-size="14" fill="#213e3d" text-anchor="start">Hypothetical rectangular loads; not a solar production forecast.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>