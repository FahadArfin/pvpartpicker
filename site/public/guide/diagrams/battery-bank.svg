<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Battery bank — energy and discharge power are separate limits</title><desc id="desc">Two hypothetical 51.2 volt, 100 amp-hour batteries in parallel retain 51.2 volt nominal voltage and provide 200 amp-hours. Protected branches feed shared DC distribution and an inverter.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Battery bank — energy and discharge power are separate limits</text><rect x="40" y="125" width="220" height="95" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="150.0" y="157" font-size="18" fill="#213e3d" text-anchor="middle">Battery A + BMS</text><text x="150.0" y="183" font-size="14" fill="#213e3d" text-anchor="middle">51.2 V nominal · 100 Ah</text><rect x="40" y="325" width="220" height="95" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="150.0" y="357" font-size="18" fill="#213e3d" text-anchor="middle">Battery B + BMS</text><text x="150.0" y="383" font-size="14" fill="#213e3d" text-anchor="middle">51.2 V nominal · 100 Ah</text><path d="M260,173 L344,173" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="142" width="130" height="65" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="420.0" y="174" font-size="18" fill="#213e3d" text-anchor="middle">Protection</text><path d="M485,173 L555,173" fill="none" stroke="#376f66" stroke-width="3"/><path d="M260,373 L344,373" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="342" width="130" height="65" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="420.0" y="374" font-size="18" fill="#213e3d" text-anchor="middle">Protection</text><path d="M485,373 L555,373" fill="none" stroke="#376f66" stroke-width="3"/><path d="M555,173 L555,373" fill="none" stroke="#376f66" stroke-width="3"/><path d="M555,273 L628,273" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="230" width="260" height="85" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="770.0" y="262" font-size="18" fill="#213e3d" text-anchor="middle">DC distribution → inverter</text><text x="770.0" y="288" font-size="14" fill="#213e3d" text-anchor="middle">Cable / fuse / BMS limits apply</text><text x="650" y="370" font-size="18" fill="#213e3d" text-anchor="start">Nominal energy:</text><text x="650" y="403" font-size="20" fill="#213e3d" text-anchor="start">51.2 × 200 = 10,240 Wh</text><text x="650" y="442" font-size="16" fill="#213e3d" text-anchor="start">Usable AC energy will be lower.</text><text x="40" y="473" font-size="14" fill="#213e3d" text-anchor="start">Simplified functional path; polarity, disconnects and sensing are not shown.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>