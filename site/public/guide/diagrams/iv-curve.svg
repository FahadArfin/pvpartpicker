<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Read the I–V curve: current, voltage and the knee</title><desc id="desc">A conceptual IV curve begins at short-circuit current with zero voltage, stays relatively flat, then drops to zero at open-circuit voltage. Maximum power lies near the knee, not at either axis intercept.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Read the I–V curve: current, voltage and the knee</text><path d="M95,435 L95,111" fill="none" stroke="#376f66" stroke-width="3"/><path d="M95,435 L800,435" fill="none" stroke="#376f66" stroke-width="3"/><path d="M95 175 C250 178 435 175 590 208 C660 228 707 323 743 435" fill="none" stroke="#28766a" stroke-width="5"/><path d="M595,211 L595,435" fill="none" stroke="#bd8030" stroke-width="3" stroke-dasharray="7 6"/><path d="M95,211 L595,211" fill="none" stroke="#bd8030" stroke-width="3" stroke-dasharray="7 6"/><circle cx="595" cy="211" r="7" fill="#bd8030"/><text x="28" y="104" font-size="18" fill="#213e3d" text-anchor="start">I (A)</text><text x="790" y="472" font-size="18" fill="#213e3d" text-anchor="start">V (V)</text><text x="110" y="160" font-size="16" fill="#213e3d" text-anchor="start">Isc: V = 0</text><text x="739" y="459" font-size="16" fill="#213e3d" text-anchor="start">Voc: I = 0</text><text x="603" y="201" font-size="18" fill="#213e3d" text-anchor="start">MPP: Vmp × Imp</text><text x="105" y="277" font-size="18" fill="#213e3d" text-anchor="start">At the two intercepts, power = 0.</text><text x="105" y="311" font-size="17" fill="#213e3d" text-anchor="start">More irradiance mainly raises current.</text><text x="105" y="342" font-size="17" fill="#213e3d" text-anchor="start">Higher cell temperature usually lowers voltage.</text><text x="95" y="486" font-size="14" fill="#213e3d" text-anchor="start">Illustrative curve only — no numerical equipment ratings implied.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>