<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Separate equipment cost, delivered cost and lifetime value</title><desc id="desc">A purchase comparison adds equipment, freight, balance-of-system and installation costs. A lifetime analysis then considers verified incentives, energy bill savings, maintenance and replacement costs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Separate equipment cost, delivered cost and lifetime value</text><rect x="35" y="110" width="180" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="125.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">Equipment</text><text x="125.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Actual package quantity</text><rect x="275" y="110" width="180" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="365.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">Freight / tax</text><text x="365.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Delivered condition</text><rect x="515" y="110" width="180" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="605.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">Balance of system</text><text x="605.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Protection / mounting</text><rect x="755" y="110" width="180" height="80" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="845.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">Installation</text><text x="845.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Labor / approvals</text><path d="M240,150 L265,150" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><path d="M480,150 L505,150" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><path d="M720,150 L745,150" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><text x="50" y="260" font-size="20" fill="#213e3d" text-anchor="start">UPFRONT: complete installed cost − verified eligible benefits</text><text x="50" y="325" font-size="20" fill="#213e3d" text-anchor="start">ONGOING: valued self-consumption + export revenue − running costs</text><text x="50" y="390" font-size="20" fill="#213e3d" text-anchor="start">LIFECYCLE: include timing, degradation, financing and replacements</text><text x="50" y="455" font-size="17" fill="#213e3d" text-anchor="start">Hypothetical price ≠ observed offer. Simple payback ≠ investment forecast.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>