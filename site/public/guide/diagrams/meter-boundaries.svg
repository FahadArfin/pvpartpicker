<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Monitoring — define the measurement boundary</title><desc id="desc">A site has PV production, home consumption, battery charge/discharge and grid import/export. Different meters measure different boundaries. Signs, timestamps and AC/DC boundaries must agree to reconcile energy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Monitoring — define the measurement boundary</text><rect x="65" y="110" width="220" height="85" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="175.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">PV production</text><text x="175.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Measure generated energy</text><path d="M285,152 L420,152" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="432" y="110" width="220" height="85" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="542.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">AC site bus</text><text x="542.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Balance all simultaneous flows</text><path d="M542,195 L542,286" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="432" y="299" width="220" height="85" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="542.0" y="331" font-size="18" fill="#213e3d" text-anchor="middle">House loads</text><text x="542.0" y="357" font-size="14" fill="#213e3d" text-anchor="middle">Consumption, not PV yield</text><path d="M652,152 L730,152" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="742" y="110" width="160" height="85" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="822.0" y="142" font-size="18" fill="#213e3d" text-anchor="middle">Grid meter</text><text x="822.0" y="168" font-size="14" fill="#213e3d" text-anchor="middle">Import ↔ export</text><rect x="65" y="299" width="220" height="85" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="175.0" y="331" font-size="18" fill="#213e3d" text-anchor="middle">Battery system</text><text x="175.0" y="357" font-size="14" fill="#213e3d" text-anchor="middle">Charge ↔ discharge</text><path d="M285,342 L420,342" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="447" font-size="18" fill="#213e3d" text-anchor="start">AC energy balance: PV + grid import + battery discharge</text><text x="65" y="477" font-size="18" fill="#213e3d" text-anchor="start">= loads + grid export + battery charge + boundary losses</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>