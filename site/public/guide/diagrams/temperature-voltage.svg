<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Cold modules raise voltage — check the equipment ceiling</title><desc id="desc">A hypothetical module has 50 volt Voc at 25 degrees Celsius and a minus 0.25 percent per degree Voc coefficient. At minus 10 degrees its approximate Voc is 54.375 volts; at 65 degrees it is 45 volts. The chart is a linear teaching approximation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Cold modules raise voltage — check the equipment ceiling</text><path d="M105,425 L105,105" fill="none" stroke="#376f66" stroke-width="3"/><path d="M105,425 L825,425" fill="none" stroke="#376f66" stroke-width="3"/><path d="M180 145 L460 245 L780 359" fill="none" stroke="#28766a" stroke-width="4"/><circle cx="180" cy="145" r="6" fill="#28766a"/><text x="180" y="126" font-size="16" fill="#213e3d" text-anchor="middle">54.375 V</text><circle cx="460" cy="245" r="6" fill="#28766a"/><text x="460" y="226" font-size="16" fill="#213e3d" text-anchor="middle">50 V</text><circle cx="780" cy="359" r="6" fill="#28766a"/><text x="780" y="340" font-size="16" fill="#213e3d" text-anchor="middle">45 V</text><text x="180" y="456" font-size="16" fill="#213e3d" text-anchor="middle">−10°C</text><text x="460" y="456" font-size="16" fill="#213e3d" text-anchor="middle">25°C</text><text x="780" y="456" font-size="16" fill="#213e3d" text-anchor="middle">65°C</text><text x="34" y="90" font-size="18" fill="#213e3d" text-anchor="start">Voc (V)</text><text x="665" y="486" font-size="17" fill="#213e3d" text-anchor="start">Cell temperature</text><text x="265" y="125" font-size="17" fill="#213e3d" text-anchor="start">Approximate Voc(T) = Voc(25) × [1 + β × (T − 25)]</text><text x="145" y="350" font-size="17" fill="#213e3d" text-anchor="start">β = −0.0025 / °C for this hypothetical module</text><text x="145" y="387" font-size="14" fill="#213e3d" text-anchor="start">Actual coefficients and design temperatures come from documented inputs.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>