<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Module anatomy — cell structure and panel face are different</title><desc id="desc">An exploded conceptual module has front glass, encapsulant, solar cells, rear encapsulant, rear glass or backsheet, frame, and rear junction box with bypass diodes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Module anatomy — cell structure and panel face are different</text><path d="M85,130 L440,95 L515,140 L160,175z" fill="#cbe5ee" stroke="#557e88"/><text x="565" y="145" font-size="18" fill="#213e3d" text-anchor="start">Front glass: admits light</text><path d="M85,190 L440,155 L515,200 L160,235z" fill="#d9ece7" stroke="#557e88"/><text x="565" y="205" font-size="18" fill="#213e3d" text-anchor="start">Encapsulant: protects and bonds</text><path d="M85,250 L440,215 L515,260 L160,295z" fill="#174c67" stroke="#557e88"/><text x="565" y="265" font-size="18" fill="#213e3d" text-anchor="start">Cells: generate electrical current</text><path d="M85,310 L440,275 L515,320 L160,355z" fill="#d9ece7" stroke="#557e88"/><text x="565" y="325" font-size="18" fill="#213e3d" text-anchor="start">Rear encapsulant</text><path d="M85,370 L440,335 L515,380 L160,415z" fill="#b6cfcd" stroke="#557e88"/><text x="565" y="385" font-size="18" fill="#213e3d" text-anchor="start">Rear glass OR polymer backsheet</text><text x="60" y="457" font-size="16" fill="#213e3d" text-anchor="start">Frame and clamp zones are model-specific.</text><text x="565" y="428" font-size="16" fill="#213e3d" text-anchor="start">Rear junction box / bypass diodes</text><text x="565" y="457" font-size="16" fill="#213e3d" text-anchor="start">Bifacial requires a light-admitting rear.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>