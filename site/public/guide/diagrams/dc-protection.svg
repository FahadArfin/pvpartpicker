<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Protection functions — do not confuse the ratings</title><desc id="desc">A DC source feeds fault-rated protection, a suitable disconnect, conductor and load. A battery fault can supply high current. Fuse current, voltage and interrupt ratings answer different questions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#376f66"/></marker></defs><rect width="960" height="540" rx="12" fill="#f5f8f5"/><g font-family="Arial, sans-serif"><text x="32" y="42" font-size="24" fill="#213e3d" text-anchor="start">Protection functions — do not confuse the ratings</text><rect x="40" y="190" width="150" height="90" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="115.0" y="222" font-size="18" fill="#213e3d" text-anchor="middle">DC source</text><text x="115.0" y="248" font-size="14" fill="#213e3d" text-anchor="middle">PV or battery</text><path d="M190,235 L253,235" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="265" y="190" width="170" height="90" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="350.0" y="222" font-size="18" fill="#213e3d" text-anchor="middle">Fuse / breaker</text><text x="350.0" y="248" font-size="14" fill="#213e3d" text-anchor="middle">Fault interruption</text><path d="M435,235 L498,235" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="190" width="170" height="90" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="595.0" y="222" font-size="18" fill="#213e3d" text-anchor="middle">Disconnect</text><text x="595.0" y="248" font-size="14" fill="#213e3d" text-anchor="middle">Safe isolation</text><path d="M680,235 L743,235" fill="none" stroke="#376f66" stroke-width="3" marker-end="url(#arrow)"/><rect x="755" y="190" width="150" height="90" rx="8" fill="#eaf2ee" stroke="#789b94"/><text x="830.0" y="222" font-size="18" fill="#213e3d" text-anchor="middle">DC load</text><text x="830.0" y="248" font-size="14" fill="#213e3d" text-anchor="middle">Controller / inverter</text><text x="45" y="335" font-size="18" fill="#213e3d" text-anchor="start">Current rating (A): protects the selected circuit under defined conditions.</text><text x="45" y="372" font-size="18" fill="#213e3d" text-anchor="start">Voltage rating (V DC): can interrupt at the circuit’s maximum voltage.</text><text x="45" y="409" font-size="18" fill="#213e3d" text-anchor="start">Interrupt rating: can clear the available fault current.</text><text x="45" y="446" font-size="18" fill="#213e3d" text-anchor="start">Cable ampacity and routing conditions remain separate checks.</text><text x="45" y="112" font-size="15" fill="#213e3d" text-anchor="start">Functional illustration only — grounding, polarity and complete protection omitted.</text><text x="32" y="514" font-size="13" fill="#5a706b" text-anchor="start">PVPartPicker · original teaching diagram · conceptual, not an installation drawing</text></g></svg>