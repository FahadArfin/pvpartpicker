name: Collect retailer prices
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retailer-price-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    env:
      PV_API_ORIGIN: ${{ vars.PV_API_ORIGIN }}
      PV_COLLECTOR_TOKEN: ${{ secrets.PV_COLLECTOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Collect and publish observations
        run: node --experimental-strip-types scripts/run-scraper.mjs
