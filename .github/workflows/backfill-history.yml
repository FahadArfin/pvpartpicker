name: Backfill attributed price history
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: Add current retailer URLs to the durable queue
        type: boolean
        default: false
      resume_rate_limit:
        description: Explicitly acknowledge source review and request resume after the stored cooldown (never clears robots/access/lookup pauses)
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: drop-solar-history-backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: site
    env:
      PV_API_ORIGIN: ${{ vars.PV_API_ORIGIN }}
      PV_COLLECTOR_TOKEN: ${{ secrets.PV_COLLECTOR_TOKEN }}
      SEED_QUEUE: ${{ inputs.seed }}
      RESUME_RATE_LIMIT: ${{ inputs.resume_rate_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Resume history queue at no more than one request per 30 seconds
        id: worker
        run: |
          if [ "$RESUME_RATE_LIMIT" = "true" ]; then
            node --experimental-strip-types scripts/drop-history-worker.mjs --resume --reviewed-rate-limit
          fi
          if [ "$SEED_QUEUE" = "true" ]; then
            node --experimental-strip-types scripts/drop-history-worker.mjs --seed --continuous
          else
            node --experimental-strip-types scripts/drop-history-worker.mjs --continuous
          fi
      - name: Hand off unfinished work immediately before the runner limit
        if: success() && steps.worker.outputs.continue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'backfill-history.yml',
              ref: context.payload.repository.default_branch,
              inputs: {seed: 'false'}
            });
